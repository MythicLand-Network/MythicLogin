import java.security.MessageDigest

plugins {
    id 'java-library'
}

configurations {
    commonRuntimeLibraries
    bukkitSqliteRuntimeLibraries
    bukkitPostgresqlRuntimeLibraries
    velocityRuntimeLibraries
    velocityPostgresqlRuntimeLibraries
}

dependencies {
    compileOnly 'cn.mythicland:mythic-framework-core:1.0.0'
    compileOnly 'com.zaxxer:HikariCP:4.0.3'
    compileOnly 'org.flywaydb:flyway-core:13.4.0'

    testImplementation 'com.zaxxer:HikariCP:4.0.3'
    testImplementation 'org.flywaydb:flyway-core:13.4.0'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql:13.4.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'

    commonRuntimeLibraries 'org.reflections:reflections:0.10.2'
    commonRuntimeLibraries 'com.zaxxer:HikariCP:4.0.3'
    commonRuntimeLibraries 'org.flywaydb:flyway-core:13.4.0'
    bukkitSqliteRuntimeLibraries 'org.xerial:sqlite-jdbc:3.46.1.3'
    bukkitPostgresqlRuntimeLibraries 'org.flywaydb:flyway-database-postgresql:13.4.0'
    bukkitPostgresqlRuntimeLibraries 'org.postgresql:postgresql:42.7.4'
    velocityRuntimeLibraries 'org.yaml:snakeyaml:2.2'
    velocityPostgresqlRuntimeLibraries 'org.flywaydb:flyway-database-postgresql:13.4.0'
    velocityPostgresqlRuntimeLibraries 'org.postgresql:postgresql:42.7.4'
}

def generatedResources = layout.buildDirectory.dir('generated/runtime-resources')

sourceSets.main.resources.srcDir(generatedResources)

tasks.register('generateRuntimeDependencyManifest') {
    outputs.file(generatedResources.map { it.file('META-INF/mythiclogin-libraries.properties') })
    doLast {
        def platformConfigurations = [
                common: configurations.commonRuntimeLibraries,
                'bukkit-sqlite': configurations.bukkitSqliteRuntimeLibraries,
                'bukkit-postgresql': configurations.bukkitPostgresqlRuntimeLibraries,
                velocity: configurations.velocityRuntimeLibraries,
                'velocity-postgresql': configurations.velocityPostgresqlRuntimeLibraries
        ]
        def libraries = [:]
        platformConfigurations.each { platform, configuration ->
            configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                def coordinate = "${id.group}:${artifact.name}:${id.version}"
                def entry = libraries.computeIfAbsent(coordinate) {
                    [artifact: artifact, platforms: new LinkedHashSet<String>()]
                }
                entry.platforms.add(platform)
            }
        }

        def output = generatedResources.get().file('META-INF/mythiclogin-libraries.properties').asFile
        output.parentFile.mkdirs()
        output.withWriter('UTF-8') { writer ->
            def ordered = libraries.entrySet().sort { left, right -> left.key <=> right.key }
            writer.println("library.count=${ordered.size()}")
            ordered.eachWithIndex { item, index ->
                def artifact = item.value.artifact
                def file = artifact.file
                def digest = MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
                def id = artifact.moduleVersion.id
                def path = "${id.group.replace('.', '/')}/${artifact.name}/${id.version}/${file.name}"
                writer.println("library.${index}.coordinate=${item.key}")
                writer.println("library.${index}.fileName=${file.name}")
                writer.println("library.${index}.downloadUrls=https://repo.maven.apache.org/maven2/${path},https://repo1.maven.org/maven2/${path}")
                writer.println("library.${index}.sha256=${digest}")
                writer.println("library.${index}.platform=${item.value.platforms.join(',')}")
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateRuntimeDependencyManifest')
}

tasks.named('jar') {
    archiveFileName = 'MythicLogin-Common.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicLogin-Common-sources.jar'
    dependsOn tasks.named('generateRuntimeDependencyManifest')
}
