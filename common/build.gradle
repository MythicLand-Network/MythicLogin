plugins {
    id 'java-library'
}

apply from: rootProject.file('../MythicFramework/gradle/runtime-library-manifest.gradle')

configurations {
    commonRuntimeLibraries
    bukkitSqliteRuntimeLibraries
    bukkitPostgresqlRuntimeLibraries
    velocityRuntimeLibraries
    velocityPostgresqlRuntimeLibraries
}

dependencies {
    compileOnly 'cn.mythicland:mythic-framework-core:1.0.0'
    compileOnly 'com.zaxxer:HikariCP:4.0.3'
    compileOnly 'org.flywaydb:flyway-core:13.4.0'

    testImplementation 'com.zaxxer:HikariCP:4.0.3'
    testImplementation 'org.flywaydb:flyway-core:13.4.0'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql:13.4.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.4'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'

    commonRuntimeLibraries 'org.reflections:reflections:0.10.2'
    commonRuntimeLibraries 'com.zaxxer:HikariCP:4.0.3'
    commonRuntimeLibraries 'org.flywaydb:flyway-core:13.4.0'
    bukkitSqliteRuntimeLibraries 'org.xerial:sqlite-jdbc:3.46.1.3'
    bukkitPostgresqlRuntimeLibraries 'org.flywaydb:flyway-database-postgresql:13.4.0'
    bukkitPostgresqlRuntimeLibraries 'org.postgresql:postgresql:42.7.4'
    velocityRuntimeLibraries 'org.yaml:snakeyaml:2.2'
    velocityPostgresqlRuntimeLibraries 'org.flywaydb:flyway-database-postgresql:13.4.0'
    velocityPostgresqlRuntimeLibraries 'org.postgresql:postgresql:42.7.4'
}

def generatedResources = layout.buildDirectory.dir('generated/runtime-resources')
def runtimeDependencyManifest = registerRuntimeLibraryManifest(
        'generateRuntimeDependencyManifest',
        generatedResources,
        'META-INF/mythiclogin-libraries.properties',
        [
                common: configurations.commonRuntimeLibraries,
                'bukkit-sqlite': configurations.bukkitSqliteRuntimeLibraries,
                'bukkit-postgresql': configurations.bukkitPostgresqlRuntimeLibraries,
                velocity: configurations.velocityRuntimeLibraries,
                'velocity-postgresql': configurations.velocityPostgresqlRuntimeLibraries
        ]
)

tasks.named('processResources') {
    dependsOn runtimeDependencyManifest
}

tasks.named('jar') {
    archiveFileName = 'MythicLogin-Common.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicLogin-Common-sources.jar'
    dependsOn runtimeDependencyManifest
}
