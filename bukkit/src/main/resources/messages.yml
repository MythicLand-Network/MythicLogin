# 所有消息支持 & 颜色代码。
# 如果某条消息需要显示前缀, 请手动加入 {prefix} 占位符。
# 下方示例消息默认不显式包含 {prefix}。

prefix: '&7[&dMythicLogin&7]&r'

# 系统消息
system:
  config-reloaded: '&a配置已重载。'
  no-permission: '&c你没有权限执行这个命令。'
  player-only: '&c该命令只能由玩家执行。'
  loading: '&c账号数据仍在加载, 请稍后再试。'
  starting-up-kick: '&c服务器仍在启动中, 请稍后重新加入。'
  timeout-kick: '&c登录超时, 请重新加入服务器。'

# 认证消息
auth:
  command-blocked: '&c你需要先完成登录或注册。'
  login-required: '&c使用 /login <密码> 完成登录。'
  register-required: '&c使用 /register <密码> <重复密码> 完成注册'
  password-mismatch: '&c两次输入的密码不一致。'
  password-length: '密码长度需要在 &f{0}&7 - &f{1} &c个字符之间。'
  already-authenticated: '&c你已经登录过了!'
  already-registered: '&c你已经注册过了!'
  not-registered: '&c你还没有注册!'
  case-mismatch: '&c检测到已有账号, 请使用正确的游戏账户 &f{0} &c登录。'
  not-authenticated: '&c你当前还没有登录。'
  change-password-usage: '&c使用 /cp <新密码> <重复新密码> 修改你的密码。'
  password-changed: '&a密码修改成功。'
  password-change-failed: '&c修改密码失败, 请查看控制台。'
  login-success: '&a登录成功, 欢迎回来。'
  register-success: '&a注册成功, 已为您自动登录。'
  auto-login-message: '&a欢迎回来, 已为你自动登录。'
  logout-success: '&c你已成功登出, 请重新登录。'
  login-failed: '&c密码错误。'

# 限制提示
restrict:
  chat-blocked: '&c你现在不能发言。'
  interaction-blocked: '&c你现在不能这样做。'

# 管理消息
admin:
  account-missing: '&c找不到玩家 &f{0} &c的账号。'
  password-updated: '&c已重置玩家 &f{0} &c的密码。'
  password-update-failed: '&c修改密码失败, 请查看控制台。'
  unregister-success: '&a已注销玩家 &f{0} &a的账号。'
  unregister-failed: '&c注销账号失败, 请查看控制台。'
