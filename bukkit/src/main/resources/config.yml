database:
  mode: sqlite
  table: mythiclogin
  postgresql:
    host: 127.0.0.1
    port: 5432
    name: mythiclogin
    username: mythiclogin
    password: change-me
  sqlite:
    file: data/mythiclogin.db
security:
  session-enabled: true
  session-timeout-minutes: 5
  min-password-length: 4
  max-password-length: 26
  auth-timeout-seconds: 60
restrictions:
  block-non-whitelist-tab-complete: true
  command-prefix-whitelist:
    - /l
    - /login
    - /reg
    - /register
    - /fp
    - /forgotpassword
premium:
  enabled: false
  shared-secret: ""
