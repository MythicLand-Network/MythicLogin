# 公共消息前缀
# 这里只定义前缀文本本身, 不会自动添加到所有消息
# 如果某条消息需要显示前缀, 请在对应消息中手动写入 {prefix}
# 以下示例默认不显式包含 {prefix}, 按需自行添加
prefix: '&7[&dMythicLoginVelocity&7]&r'

# 代理消息
proxy:
  case-mismatch-kick: '&c检测到已有账号, 请使用正确的游戏账户 &f{0} &c登录。'
  command-blocked: '&c你需要先完成登录或注册。'
  account-data-missing: '&c代理端没有找到你的账号数据, 请联系管理员检查 MythicLoginVelocity 数据库配置。'
