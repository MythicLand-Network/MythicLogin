plugins {
    id 'com.gradleup.shadow'
}

configurations {
    firstPartyEmbedded {
        transitive = false
    }
}

dependencies {
    implementation project(':common')
    compileOnly 'cn.mythicland:mythic-framework-core:1.0.0'
    compileOnly 'com.zaxxer:HikariCP:4.0.3'
    compileOnly 'org.flywaydb:flyway-core:13.4.0'
    compileOnly 'org.yaml:snakeyaml:2.2'

    firstPartyEmbedded project(':common')
    firstPartyEmbedded 'cn.mythicland:mythic-framework-core:1.0.0'

    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    testImplementation 'cn.mythicland:mythic-framework-core:1.0.0'
    testImplementation 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
}

tasks.named('shadowJar') {
    archiveFileName = 'MythicLogin-Velocity.jar'
    configurations = [project.configurations.firstPartyEmbedded]
}

tasks.named('jar') {
    archiveFileName = 'MythicLogin-Velocity-plain.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicLogin-Velocity-sources.jar'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}
